name: Publish results page

on:
  workflow_dispatch:
  schedule:
    # LOTO: Monday, Wednesday, Saturday. Extra run covers winter/summer time.
    - cron: "35 20 * * 1,3,6"
    - cron: "35 21 * * 1,3,6"
    # EuroMillions: Tuesday, Friday. Extra run covers winter/summer time.
    - cron: "35 21 * * 2,5"
    - cron: "35 22 * * 2,5"
    # Morning catch-up in case FDJ publishes late or GitHub delays a run.
    - cron: "5 7 * * 0,2,3,4,6"
    - cron: "5 8 * * 0,2,3,4,6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate page
        run: python fetch_results.py --output-dir dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
